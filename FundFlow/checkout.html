<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout — FundFlow</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body data-page="checkout"><div id="appHeader"></div><main><section class="section"><div class="container checkout-layout"><div class="panel"><span class="eyebrow">Secure demo checkout</span><h1>Your contribution</h1><div id="checkoutCampaign"></div><form id="checkoutForm" class="form-grid"><label>Donation amount (₹)<input id="donationAmount" type="number" min="100" step="50" value="1000" required></label><div><span class="field-label">Payment method</span><div class="payment-methods"><label class="method"><input type="radio" name="method" value="UPI" checked><i class="fa-solid fa-mobile-screen-button"></i><span>UPI</span></label><label class="method"><input type="radio" name="method" value="Credit Card"><i class="fa-regular fa-credit-card"></i><span>Credit Card</span></label><label class="method"><input type="radio" name="method" value="Debit Card"><i class="fa-regular fa-credit-card"></i><span>Debit Card</span></label><label class="method"><input type="radio" name="method" value="Net Banking"><i class="fa-solid fa-building-columns"></i><span>Net Banking</span></label><label class="method"><input type="radio" name="method" value="Wallet"><i class="fa-solid fa-wallet"></i><span>Wallet</span></label></div><div id="paymentDetails" class="payment-details"></div><label class="check"><input id="anonymous" type="checkbox"> Donate anonymously</label><label class="check"><input id="coverFee" type="checkbox" checked> Cover platform processing fee</label><button class="btn btn-primary btn-block" type="submit">Continue to payment <i class="fa-solid fa-lock"></i></button></form><div class="secure-note"><i class="fa-solid fa-shield-halved"></i><div><strong>Secure demo checkout</strong><p>Your payment details are validated locally and never sent anywhere.</p></div></div><div class="demo-banner"><i class="fa-solid fa-triangle-exclamation"></i><div><strong>Demo Payment Environment</strong><p>No real money is transferred. Do not enter real payment credentials.</p></div></div></div><aside class="panel order-summary"><span class="eyebrow">Order summary</span><h2>Contribution details</h2><div id="summary"></div></aside></div></section></main><div id="appFooter"></div><div id="toastContainer"></div><script src="js/storage.js"></script><script src="js/app.js"></script><script src="js/donation.js"></script><script src="js/checkout.js"></script></body></html>
