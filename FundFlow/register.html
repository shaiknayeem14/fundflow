<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account — FundFlow</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body class="auth-page"><div class="auth-shell"><a class="brand auth-brand" href="index.html"><span class="brand-mark">F</span>FundFlow</a><div class="auth-card"><div class="auth-header"><span class="eyebrow">Join the movement</span><h1>Create your account</h1><p>Start supporting causes or create your own campaign.</p></div><form id="registerForm" class="form-grid"><label>Full name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Password<div class="password-wrap"><input id="password" type="password" minlength="8" required autocomplete="new-password" data-password-strength="#passwordStrength"><button type="button" class="icon-btn" data-toggle-password><i class="fa-regular fa-eye"></i></button></div><small id="passwordStrength" class="password-strength">Use 8+ chars with upper/lowercase, number & symbol.</small></label><label>Confirm password<input id="confirmPassword" type="password" minlength="6" required></label><button class="btn btn-primary btn-block" type="submit">Create account <i class="fa-solid fa-user-plus"></i></button></form><p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p></div></div><div id="toastContainer"></div><script src="js/storage.js"></script><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
